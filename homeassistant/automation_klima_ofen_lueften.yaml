# Home Assistant Automation „Klima Ofen Lüften“ (optional)
# Verteilt die Ofenwärme: Ist der Ofen heiß und der Raum warm, läuft die Klimaanlage im Lüftermodus.
# climate.klimaanlage durch das eigene Klimagerät ersetzen. Export, Stand 24.11.2026.
- id: klima_ofen_lueften
  alias: Klima Ofen Lüften
  description: >-
    Schaltet die Klimaanlage in den Lüftermodus, wenn der Ofen heiß wird und der Raum warm ist.
    Sobald der Raum unter 24 °C abgekühlt ist (spätestens nach 3 Stunden), wird die Klimaanlage
    wieder auf Heizen gestellt und danach ausgeschaltet.
  mode: restart
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.ofensteuerung_v4_ofen_temperatur
      above: 300
  conditions:
    - condition: numeric_state
      entity_id: climate.klimaanlage
      attribute: current_temperature
      above: 24
    - condition: time
      after: "07:00:00"
      before: "23:30:00"
      weekday: [mon, tue, wed, thu, fri, sat, sun]
  actions:
    - action: climate.turn_on
      target:
        entity_id: climate.klimaanlage
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.klimaanlage
      data:
        hvac_mode: fan_only
    - alias: Warten bis der Raum abgekühlt ist
      wait_for_trigger:
        - trigger: numeric_state
          entity_id: climate.klimaanlage
          attribute: current_temperature
          below: 24
      timeout:
        hours: 3
      continue_on_timeout: true
    - alias: Nur zurückstellen, wenn die Klima noch im Lüftermodus ist
      if:
        - condition: state
          entity_id: climate.klimaanlage
          state: fan_only
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.klimaanlage
          data:
            hvac_mode: heat
        - delay:
            seconds: 5
        - action: climate.turn_off
          target:
            entity_id: climate.klimaanlage
